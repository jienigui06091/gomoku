<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>五子棋 · Gomoku</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg" />
<style>
  :root {
    --bg: #0b0f17;
    --card: rgba(255, 255, 255, 0.045);
    --stroke: rgba(255, 255, 255, 0.1);
    --text: #eef1f6;
    --muted: #97a1b2;
    --accent: #6ea8fe;
    --gold: #ffd166;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: clamp(14px, 2.4vw, 32px);
    display: grid;
    place-items: center;
    background:
      radial-gradient(1100px 620px at 16% -12%, rgba(110, 168, 254, 0.16), transparent 62%),
      radial-gradient(900px 520px at 108% 118%, rgba(255, 209, 102, 0.1), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    width: min(1060px, 100%);
    display: grid;
    grid-template-columns: minmax(0, 1fr) 264px;
    grid-template-areas: 'top top' 'board panel';
    gap: clamp(14px, 1.8vw, 24px);
    align-items: start;
  }

  .topbar {
    grid-area: top;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 { margin: 0; font-size: clamp(20px, 2.4vw, 26px); letter-spacing: 0.06em; font-weight: 650; }
  .brand-sub { color: var(--muted); font-size: 11px; letter-spacing: 0.28em; text-transform: uppercase; }
  .brand-mark {
    width: 12px; height: 12px; border-radius: 50%;
    align-self: center;
    background: radial-gradient(circle at 34% 30%, #fff, #8ea6c8 42%, #1d2430 78%);
    box-shadow: 0 0 14px rgba(110, 168, 254, 0.55);
  }

  .score { display: flex; gap: 8px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 6px 12px;
    border: 1px solid var(--stroke);
    border-radius: 999px;
    background: var(--card);
    font-size: 12px;
    color: var(--muted);
    transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
  }
  .chip b { color: var(--text); font-variant-numeric: tabular-nums; }
  .chip.active { color: var(--text); border-color: rgba(110, 168, 254, 0.55); background: rgba(110, 168, 254, 0.12); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.black { background: radial-gradient(circle at 34% 30%, #7c8797, #10141b 72%); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18); }
  .dot.white { background: radial-gradient(circle at 34% 30%, #fff, #cfd6e0 70%); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.18); }

  .board-wrap {
    grid-area: board;
    display: grid;
    place-items: center;
    padding: clamp(8px, 1.4vw, 16px);
    border: 1px solid var(--stroke);
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.012));
    box-shadow: 0 30px 70px -40px rgba(0, 0, 0, 0.9);
  }

  canvas {
    display: block;
    border-radius: 14px;
    touch-action: manipulation;
    cursor: crosshair;
    box-shadow:
      0 2px 0 rgba(255, 255, 255, 0.25) inset,
      0 18px 34px -18px rgba(0, 0, 0, 0.85);
  }

  .panel {
    grid-area: panel;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 16px;
    border: 1px solid var(--stroke);
    border-radius: 18px;
    background: var(--card);
    backdrop-filter: blur(12px);
  }

  .status {
    display: flex; align-items: center; gap: 9px;
    margin: 0;
    font-size: 14px;
    font-weight: 550;
    letter-spacing: 0.02em;
  }
  .status .turn-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #7c8797, #10141b 72%);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.16);
    transition: background 200ms ease;
  }
  .status[data-side="white"] .turn-dot { background: radial-gradient(circle at 34% 30%, #fff, #cfd6e0 70%); }
  .status[data-state="over"] { color: var(--gold); }

  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .field[hidden] { display: none; }
  .field label { font-size: 12px; color: var(--muted); }

  select, button {
    font: inherit;
    color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--stroke);
    border-radius: 10px;
    padding: 8px 10px;
    transition: background 160ms ease, border-color 160ms ease, transform 120ms ease;
  }
  select { min-width: 108px; cursor: pointer; }
  select option { background: #121722; }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
  button { cursor: pointer; font-size: 13px; }
  button:hover { background: rgba(255, 255, 255, 0.11); border-color: rgba(255, 255, 255, 0.2); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(180deg, rgba(110, 168, 254, 0.95), rgba(76, 132, 224, 0.95));
    border-color: transparent;
    color: #071120;
    font-weight: 600;
  }
  button.primary:hover { background: linear-gradient(180deg, #86b7ff, #5b93e8); }

  .hint, .moves { margin: 0; font-size: 11.5px; line-height: 1.7; color: var(--muted); }
  .moves { color: rgba(151, 161, 178, 0.85); font-variant-numeric: tabular-nums; }
  kbd {
    font: 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    padding: 3px 5px;
    border: 1px solid var(--stroke);
    border-bottom-width: 2px;
    border-radius: 5px;
    color: var(--text);
    background: rgba(255, 255, 255, 0.05);
  }

  @media (max-width: 820px) {
    .app { grid-template-columns: minmax(0, 1fr); grid-template-areas: 'top' 'board' 'panel'; }
    .panel { flex-direction: row; flex-wrap: wrap; align-items: center; }
    .status { flex: 1 1 100%; }
    .field { flex: 0 0 auto; }
    .actions { flex: 1 1 auto; grid-template-columns: repeat(2, minmax(96px, 1fr)); }
    .hint { flex: 1 1 100%; }
  }
</style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <h1>五子棋</h1>
        <span class="brand-sub">Gomoku</span>
      </div>
      <div class="score">
        <span class="chip" id="chipBlack"><i class="dot black"></i>黑 <b id="scoreBlack">0</b></span>
        <span class="chip" id="chipWhite"><i class="dot white"></i>白 <b id="scoreWhite">0</b></span>
      </div>
    </header>

    <section class="board-wrap" id="boardWrap">
      <canvas id="board" aria-label="五子棋棋盘"></canvas>
    </section>

    <aside class="panel">
      <p class="status" id="status" data-side="black" aria-live="polite">
        <span class="turn-dot"></span><span id="statusText">黑方先行</span>
      </p>

      <div class="field">
        <label for="mode">模式</label>
        <select id="mode">
          <option value="pve" selected>人机对战</option>
          <option value="pvp">双人对战</option>
        </select>
      </div>

      <div class="field" id="difficultyField">
        <label for="difficulty">难度</label>
        <select id="difficulty">
          <option value="easy">简单</option>
          <option value="normal" selected>普通</option>
          <option value="hard">困难</option>
        </select>
      </div>

      <div class="actions">
        <button id="restart" class="primary" type="button">新局</button>
        <button id="undo" type="button">悔棋</button>
      </div>

      <p class="hint">点击棋盘落子 · 快捷键 <kbd>R</kbd> 新局 / <kbd>U</kbd> 悔棋</p>
      <p class="moves" id="moveCount">第 1 手</p>
    </aside>
  </main>

<script>
(() => {
  'use strict';

  const SIZE = 15;
  const EMPTY = 0;
  const BLACK = 1;
  const WHITE = 2;
  const DRAW = 3;
  const WIN_SCORE = 10_000_000;
  const STARS = [[3, 3], [11, 3], [7, 7], [3, 11], [11, 11]];
  const DIRS = [[1, 0], [0, 1], [1, 1], [1, -1]];

  /** Pattern value table, matched top-down against a 9-cell window. */
  const PATTERNS = [
    [/11111/, WIN_SCORE],
    [/011110/, 1_000_000],
    [/11110|01111|11011|10111|11101/, 80_000],
    [/011100|001110|011010|010110/, 30_000],
    [/11100|00111|11010|01011|10110|01101|11001|10011/, 6_000],
    [/001100|011000|000110|010100|001010|010010/, 1_200],
    [/11000|00011|10100|00101|01010|10001/, 200],
    [/1/, 20],
  ];

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const wrap = document.getElementById('boardWrap');
  const statusEl = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const moveCountEl = document.getElementById('moveCount');
  const chipBlack = document.getElementById('chipBlack');
  const chipWhite = document.getElementById('chipWhite');
  const scoreBlack = document.getElementById('scoreBlack');
  const scoreWhite = document.getElementById('scoreWhite');
  const modeEl = document.getElementById('mode');
  const difficultyEl = document.getElementById('difficulty');
  const difficultyField = document.getElementById('difficultyField');

  const createBoard = () => Array.from({ length: SIZE }, () => new Array(SIZE).fill(EMPTY));
  const inBounds = (x, y) => x >= 0 && x < SIZE && y >= 0 && y < SIZE;

  const state = {
    board: createBoard(),
    turn: BLACK,
    history: [],
    winner: 0,
    winCells: null,
    hover: null,
    thinking: false,
    mode: 'pve',
    difficulty: 'normal',
    wins: { black: 0, white: 0 },
  };

  /* ------------------------------------------------------------------ *
   * Rules
   * ------------------------------------------------------------------ */

  /** Consecutive run through (x, y); returns its cells when it reaches five. */
  function runLine(board, x, y, player) {
    for (const [dx, dy] of DIRS) {
      const cells = [[x, y]];
      for (const sign of [1, -1]) {
        let i = x + dx * sign;
        let j = y + dy * sign;
        while (inBounds(i, j) && board[i][j] === player) {
          if (sign === 1) cells.push([i, j]);
          else cells.unshift([i, j]);
          i += dx * sign;
          j += dy * sign;
        }
      }
      if (cells.length >= 5) return cells;
    }
    return null;
  }

  /* ------------------------------------------------------------------ *
   * Evaluation
   * ------------------------------------------------------------------ */

  /** Nine-cell window through the point, as 1 = player, 2 = blocked, 0 = empty. */
  function windowText(board, x, y, dx, dy, player) {
    let text = '';
    for (let step = -4; step <= 4; step += 1) {
      const i = x + dx * step;
      const j = y + dy * step;
      if (!inBounds(i, j)) text += '2';
      else if (board[i][j] === player) text += '1';
      else if (board[i][j] === EMPTY) text += '0';
      else text += '2';
    }
    return text;
  }

  /** Score of the four lines through a point already owned by `player`. */
  function pointScore(board, x, y, player) {
    let total = 0;
    for (const [dx, dy] of DIRS) {
      const text = windowText(board, x, y, dx, dy, player);
      for (const [pattern, value] of PATTERNS) {
        if (pattern.test(text)) {
          total += value;
          break;
        }
      }
    }
    return total;
  }

  /** Score the board as if `player` placed at (x, y), without mutating it. */
  function placeScore(board, x, y, player) {
    board[x][y] = player;
    const score = pointScore(board, x, y, player);
    board[x][y] = EMPTY;
    return score;
  }

  /** Empty points within two cells of a stone (or the centre on an empty board). */
  function candidateMoves(board) {
    const seen = new Set();
    const out = [];
    for (let x = 0; x < SIZE; x += 1) {
      for (let y = 0; y < SIZE; y += 1) {
        if (board[x][y] === EMPTY) continue;
        for (let dx = -2; dx <= 2; dx += 1) {
          for (let dy = -2; dy <= 2; dy += 1) {
            const i = x + dx;
            const j = y + dy;
            if (!inBounds(i, j) || board[i][j] !== EMPTY) continue;
            const key = i * SIZE + j;
            if (seen.has(key)) continue;
            seen.add(key);
            out.push([i, j]);
          }
        }
      }
    }
    if (out.length === 0) out.push([Math.floor(SIZE / 2), Math.floor(SIZE / 2)]);
    return out;
  }

  /** Opponent's best available score after `player` plays (x, y). */
  function opponentBest(board, player, opponent) {
    let best = 0;
    for (const [x, y] of candidateMoves(board)) {
      const value = placeScore(board, x, y, opponent) + placeScore(board, x, y, player) * 0.7;
      if (value > best) best = value;
    }
    return best;
  }

  /**
   * Pick a move: win, block a loss, then rank by attack + defence. Hard also
   * looks one reply ahead so it does not walk into a double threat.
   */
  function chooseMove(board, player, difficulty) {
    const opponent = player === BLACK ? WHITE : BLACK;
    const scored = candidateMoves(board).map(([x, y]) => ({
      x,
      y,
      attack: placeScore(board, x, y, player),
      defend: placeScore(board, x, y, opponent),
    }));

    const finishers = scored.filter(move => move.attack >= WIN_SCORE);
    if (finishers.length > 0) return bestBy(finishers, move => move.attack);

    const blocks = scored.filter(move => move.defend >= WIN_SCORE);
    if (blocks.length > 0) return bestBy(blocks, move => move.attack);

    const weight = difficulty === 'easy' ? 0.5 : difficulty === 'hard' ? 0.95 : 0.8;
    const noise = difficulty === 'easy' ? 9000 : difficulty === 'normal' ? 900 : 120;
    const ranked = scored
      .map(move => ({ ...move, value: move.attack + move.defend * weight + Math.random() * noise }))
      .sort((a, b) => b.value - a.value);

    if (difficulty !== 'hard') {
      const pick = ranked[0];
      return [pick.x, pick.y];
    }

    let best = null;
    for (const move of ranked.slice(0, 6)) {
      board[move.x][move.y] = player;
      const reply = opponentBest(board, player, opponent);
      board[move.x][move.y] = EMPTY;
      const value = move.value - reply * 0.9;
      if (best === null || value > best.value) best = { x: move.x, y: move.y, value };
    }
    return [best.x, best.y];
  }

  function bestBy(moves, score) {
    let best = moves[0];
    let bestScore = score(best);
    for (const move of moves) {
      const value = score(move);
      if (value > bestScore) {
        best = move;
        bestScore = value;
      }
    }
    return [best.x, best.y];
  }

  /* ------------------------------------------------------------------ *
   * Rendering
   * ------------------------------------------------------------------ */

  let pulseFrame = 0;

  function metrics() {
    const rect = canvas.getBoundingClientRect();
    const size = rect.width || 480;
    const pad = Math.max(16, size * 0.052);
    return { size, pad, cell: (size - pad * 2) / (SIZE - 1) };
  }

  function starPath() {
    const { pad, cell } = metrics();
    const r = Math.max(2, cell * 0.12);
    ctx.beginPath();
    for (const [x, y] of STARS) {
      const cx = pad + x * cell;
      const cy = pad + y * cell;
      ctx.moveTo(cx + r, cy);
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
    }
    ctx.fill();
  }

  function drawStone(x, y, player, alpha) {
    const { pad, cell } = metrics();
    const cx = pad + x * cell;
    const cy = pad + y * cell;
    const r = cell * 0.44;
    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.shadowColor = 'rgba(40, 26, 10, 0.5)';
    ctx.shadowBlur = r * 0.55;
    ctx.shadowOffsetY = r * 0.22;
    const fill = ctx.createRadialGradient(cx - r * 0.34, cy - r * 0.4, r * 0.08, cx, cy, r);
    if (player === BLACK) {
      fill.addColorStop(0, '#77828f');
      fill.addColorStop(0.42, '#2b313b');
      fill.addColorStop(1, '#0b0e13');
    } else {
      fill.addColorStop(0, '#ffffff');
      fill.addColorStop(0.5, '#f3f5f9');
      fill.addColorStop(1, '#c3cad5');
    }
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = alpha === undefined ? 1 : alpha;
    ctx.strokeStyle = player === BLACK ? 'rgba(255,255,255,0.12)' : 'rgba(60,72,90,0.28)';
    ctx.lineWidth = Math.max(1, r * 0.07);
    ctx.beginPath();
    ctx.arc(cx, cy, r - ctx.lineWidth / 2, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function draw() {
    const { size, pad, cell } = metrics();
    const span = (SIZE - 1) * cell;
    const glow = state.winner === 0 || state.winner === DRAW ? 0 : 0.6 + 0.4 * Math.sin(performance.now() / 240);

    ctx.clearRect(0, 0, size, size);

    const wood = ctx.createLinearGradient(0, 0, size, size);
    wood.addColorStop(0, '#eed3a3');
    wood.addColorStop(0.45, '#e7c288');
    wood.addColorStop(1, '#d8ab6c');
    ctx.fillStyle = wood;
    ctx.beginPath();
    ctx.roundRect(0, 0, size, size, Math.max(10, size * 0.022));
    ctx.fill();

    ctx.save();
    ctx.globalAlpha = 0.06;
    ctx.strokeStyle = '#6b4318';
    ctx.lineWidth = 1;
    for (let i = 0; i < 26; i += 1) {
      const y = (i / 26) * size + Math.sin(i * 1.7) * 4;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.bezierCurveTo(size * 0.35, y + 6, size * 0.65, y - 6, size, y + 2);
      ctx.stroke();
    }
    ctx.restore();

    ctx.strokeStyle = 'rgba(70, 45, 18, 0.62)';
    ctx.lineWidth = Math.max(1, size / 620);
    ctx.beginPath();
    for (let i = 0; i < SIZE; i += 1) {
      const p = pad + i * cell;
      ctx.moveTo(pad, p);
      ctx.lineTo(pad + span, p);
      ctx.moveTo(p, pad);
      ctx.lineTo(p, pad + span);
    }
    ctx.stroke();

    ctx.strokeStyle = 'rgba(70, 45, 18, 0.85)';
    ctx.lineWidth = Math.max(1.4, size / 340);
    ctx.beginPath();
    ctx.rect(pad - 0.5, pad - 0.5, span + 1, span + 1);
    ctx.stroke();

    ctx.fillStyle = 'rgba(70, 45, 18, 0.75)';
    starPath();

    for (let x = 0; x < SIZE; x += 1) {
      for (let y = 0; y < SIZE; y += 1) {
        if (state.board[x][y] !== EMPTY) drawStone(x, y, state.board[x][y]);
      }
    }

    if (state.winCells !== null) {
      const first = state.winCells[0];
      const last = state.winCells[state.winCells.length - 1];
      ctx.save();
      ctx.strokeStyle = `rgba(255, 209, 102, ${0.55 + glow * 0.35})`;
      ctx.lineWidth = Math.max(2, cell * 0.09);
      ctx.lineCap = 'round';
      ctx.shadowColor = 'rgba(255, 209, 102, 0.85)';
      ctx.shadowBlur = cell * 0.9;
      ctx.beginPath();
      ctx.moveTo(pad + first[0] * cell, pad + first[1] * cell);
      ctx.lineTo(pad + last[0] * cell, pad + last[1] * cell);
      ctx.stroke();
      ctx.restore();
      for (const [x, y] of state.winCells) {
        ctx.save();
        ctx.strokeStyle = `rgba(255, 209, 102, ${0.5 + glow * 0.4})`;
        ctx.lineWidth = Math.max(1.5, cell * 0.055);
        ctx.beginPath();
        ctx.arc(pad + x * cell, pad + y * cell, cell * 0.47, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    } else if (state.history.length > 0) {
      const last = state.history[state.history.length - 1];
      ctx.save();
      ctx.fillStyle = last.player === BLACK ? 'rgba(255, 209, 102, 0.95)' : 'rgba(58, 126, 235, 0.95)';
      ctx.beginPath();
      ctx.arc(pad + last.x * cell, pad + last.y * cell, Math.max(2, cell * 0.1), 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    if (state.hover !== null && state.winner === 0 && !state.thinking) {
      const [hx, hy] = state.hover;
      if (state.board[hx][hy] === EMPTY) drawStone(hx, hy, state.turn, 0.32);
    }
  }

  function startPulse() {
    if (pulseFrame !== 0) return;
    const loop = () => {
      draw();
      pulseFrame = requestAnimationFrame(loop);
    };
    pulseFrame = requestAnimationFrame(loop);
  }

  function stopPulse() {
    if (pulseFrame === 0) return;
    cancelAnimationFrame(pulseFrame);
    pulseFrame = 0;
  }

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const styles = getComputedStyle(wrap);
    const innerWidth = (wrap.clientWidth || 480)
      - (parseFloat(styles.paddingLeft) || 0)
      - (parseFloat(styles.paddingRight) || 0);
    const available = Math.min(innerWidth, window.innerHeight * 0.76);
    const size = Math.max(240, Math.floor(available));
    canvas.style.width = `${size}px`;
    canvas.style.height = `${size}px`;
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  /* ------------------------------------------------------------------ *
   * Game flow
   * ------------------------------------------------------------------ */

  function renderStatus() {
    const over = state.winner !== 0;
    statusEl.dataset.state = over ? 'over' : 'play';
    statusEl.dataset.side = state.turn === BLACK ? 'black' : 'white';
    chipBlack.classList.toggle('active', !over && state.turn === BLACK);
    chipWhite.classList.toggle('active', !over && state.turn === WHITE);
    scoreBlack.textContent = String(state.wins.black);
    scoreWhite.textContent = String(state.wins.white);
    moveCountEl.textContent = state.winner === DRAW ? '棋盘已满，平局' : `第 ${state.history.length + (over ? 0 : 1)} 手`;
    difficultyField.hidden = state.mode !== 'pve';

    if (state.winner === BLACK) statusText.textContent = '黑方五连，胜！';
    else if (state.winner === WHITE) statusText.textContent = state.mode === 'pve' ? 'AI 五连，你输了' : '白方五连，胜！';
    else if (state.winner === DRAW) statusText.textContent = '平局';
    else if (state.thinking) statusText.textContent = 'AI 思考中…';
    else if (state.mode === 'pve') statusText.textContent = state.turn === BLACK ? '轮到你落子（黑）' : 'AI 思考中…';
    else statusText.textContent = state.turn === BLACK ? '黑方落子' : '白方落子';
  }

  function place(x, y) {
    if (!inBounds(x, y) || state.board[x][y] !== EMPTY || state.winner !== 0) return false;
    const player = state.turn;
    state.board[x][y] = player;
    state.history.push({ x, y, player });

    const line = runLine(state.board, x, y, player);
    if (line !== null) {
      state.winner = player;
      state.winCells = line;
      if (player === BLACK) state.wins.black += 1;
      else state.wins.white += 1;
      startPulse();
    } else if (state.history.length === SIZE * SIZE) {
      state.winner = DRAW;
      startPulse();
    } else {
      state.turn = player === BLACK ? WHITE : BLACK;
    }

    state.hover = null;
    renderStatus();
    draw();
    if (state.winner === 0 && state.mode === 'pve' && state.turn === WHITE) scheduleAi();
    return true;
  }

  function scheduleAi() {
    state.thinking = true;
    renderStatus();
    draw();
    window.setTimeout(() => {
      const move = chooseMove(state.board, WHITE, state.difficulty);
      state.thinking = false;
      if (move === null || !place(move[0], move[1])) {
        renderStatus();
        draw();
      }
    }, 80);
  }

  function undo() {
    if (state.thinking || state.history.length === 0) return;
    stopPulse();
    const takeBack = () => {
      const last = state.history.pop();
      if (last === undefined) return null;
      state.board[last.x][last.y] = EMPTY;
      state.turn = last.player;
      return last;
    };

    const last = takeBack();
    if (state.mode === 'pve' && last !== null && last.player === WHITE) takeBack();
    state.winner = 0;
    state.winCells = null;
    state.hover = null;
    renderStatus();
    draw();
  }

  function reset() {
    stopPulse();
    state.board = createBoard();
    state.turn = BLACK;
    state.history = [];
    state.winner = 0;
    state.winCells = null;
    state.hover = null;
    state.thinking = false;
    renderStatus();
    draw();
  }

  /* ------------------------------------------------------------------ *
   * Input
   * ------------------------------------------------------------------ */

  function pointAt(event) {
    const rect = canvas.getBoundingClientRect();
    const { pad, cell } = metrics();
    const x = Math.round((event.clientX - rect.left - pad) / cell);
    const y = Math.round((event.clientY - rect.top - pad) / cell);
    if (!inBounds(x, y)) return null;
    const dx = event.clientX - rect.left - (pad + x * cell);
    const dy = event.clientY - rect.top - (pad + y * cell);
    if (Math.hypot(dx, dy) > cell * 0.52) return null;
    return [x, y];
  }

  canvas.addEventListener('pointerdown', (event) => {
    if (state.thinking || state.winner !== 0) return;
    if (state.mode === 'pve' && state.turn !== BLACK) return;
    const point = pointAt(event);
    if (point !== null) place(point[0], point[1]);
  });

  canvas.addEventListener('pointermove', (event) => {
    if (state.winner !== 0 || state.thinking) return;
    const point = pointAt(event);
    const next = point === null ? null : point;
    const changed = (next === null) !== (state.hover === null)
      || (next !== null && state.hover !== null && (next[0] !== state.hover[0] || next[1] !== state.hover[1]));
    if (!changed) return;
    state.hover = next;
    canvas.style.cursor = next === null ? 'default' : 'crosshair';
    draw();
  });

  canvas.addEventListener('pointerleave', () => {
    if (state.hover === null) return;
    state.hover = null;
    draw();
  });

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('undo').addEventListener('click', undo);

  modeEl.addEventListener('change', () => {
    state.mode = modeEl.value;
    reset();
    if (state.mode === 'pve') scheduleAiTurn();
  });

  difficultyEl.addEventListener('change', () => { state.difficulty = difficultyEl.value; });

  document.addEventListener('keydown', (event) => {
    if (event.metaKey || event.ctrlKey || event.altKey) return;
    const key = event.key.toLowerCase();
    if (key === 'r') reset();
    else if (key === 'u') undo();
  });

  function scheduleAiTurn() {
    if (state.mode === 'pve' && state.turn === WHITE && state.winner === 0) scheduleAi();
  }

  window.addEventListener('resize', resize);
  if (typeof ResizeObserver === 'function') new ResizeObserver(resize).observe(wrap);

  renderStatus();
  resize();

  // Debug handle for scripted checks; harmless in normal use.
  window.__gomoku = {
    state,
    place,
    undo,
    reset,
    chooseMove,
    runLine,
    placeScore,
    resize,
    metrics,
    get winner() { return state.winner; },
    get turn() { return state.turn; },
  };
})();
</script>
</body>
</html>
